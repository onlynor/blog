version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # weekly instead of daily: one PR to review, not one every morning
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    groups:
      # one group for patch + minor, so a week's updates arrive as a single PR
      npm-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    pull-request-branch-name:
      separator: "-"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
